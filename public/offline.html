<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>You're offline | MedGenz</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 440px; }
      img { width: 88px; height: 88px; object-fit: contain; }
      h1 { margin: 24px 0 12px; font-size: 1.75rem; }
      p { margin: 0 0 24px; color: #475569; line-height: 1.6; }
      a {
        display: inline-block;
        border-radius: 12px;
        padding: 12px 20px;
        background: #0f172a;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-180.png" alt="MedGenz">
      <h1>You're offline</h1>
      <p>It looks like your internet connection is unavailable. Reconnect and try again, or return to the MedGenz homepage.</p>
      <a href="/">Back to MedGenz</a>
    </main>
  </body>
</html>
